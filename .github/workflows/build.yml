name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts parse and pass shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          for f in docker/entrypoint.sh docker/bin/* scripts/*.sh; do
            bash -n "$f"
            shellcheck -S warning "$f"
          done
      - name: Compose file is valid
        run: docker compose config >/dev/null

  # Both architectures build and smoke-test on their own native runner. ARM
  # runners are free for public repositories; emulating this under QEMU would
  # mean a rustup toolchain install and a node-pty compile through translation.
  build:
    runs-on: ${{ matrix.runner }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        target: [slim, full]
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # The full image is several GB; the default runner does not have room
      # for it alongside the preinstalled toolchains.
      - name: Reclaim disk
        if: matrix.target == 'full'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.target }} (${{ matrix.platform }})
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.platform }}
          load: true
          tags: t3code:${{ matrix.target }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.platform }}
          cache-to: type=gha,mode=min,scope=${{ matrix.target }}-${{ matrix.platform }}

      - name: Smoke test
        run: scripts/smoke-test.sh t3code:${{ matrix.target }}

  # Push one image per architecture by digest, then stitch them into a single
  # manifest list in `merge`. Pulling ghcr.io/<repo>:full then resolves to
  # whichever architecture the host actually is.
  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ${{ matrix.runner }}
    needs: build
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [slim, full]
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.target }}-${{ matrix.platform }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [slim, full]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.target }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          # `flavor: suffix` would apply to every tag, turning the bare `slim`
          # tag into `slim-slim`. Spell each one out instead.
          #   full -> :full :latest :1.2.3 :1.2 :1.2.3-full :1.2-full
          #   slim -> :slim :1.2.3-slim :1.2-slim
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.target }}
            type=semver,pattern={{version}},suffix=-${{ matrix.target }}
            type=semver,pattern={{major}}.{{minor}},suffix=-${{ matrix.target }}
            type=raw,value=latest,enable=${{ matrix.target == 'full' }}
            type=semver,pattern={{version}},enable=${{ matrix.target == 'full' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ matrix.target == 'full' }}

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE }}@sha256:%s ' *)

      - name: Verify both architectures are present
        run: |
          tag="$(jq -cr '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          docker buildx imagetools inspect "$tag" | tee /tmp/inspect.txt
          for want in linux/amd64 linux/arm64; do
            grep -q "$want" /tmp/inspect.txt || { echo "missing $want in $tag" >&2; exit 1; }
          done
