name: publish Docker Hub

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release to copy (for example v0.18.0)
        required: true
        type: string
      dry_run:
        description: Validate evidence and source indexes without publishing
        default: false
        type: boolean

# Never execute code from a release tag with registry credentials. A manual
# retry always uses the current main workflow and publisher implementation.
permissions:
  contents: read

concurrency:
  group: dockerhub-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'dizys/t3code-docker'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check publishing credentials
        if: env.DRY_RUN != 'true'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo '::error::Set the DOCKERHUB_TOKEN repository secret to a Docker Hub token with read/write access to dizys/t3code-docker.'
            exit 1
          fi
      - name: Install pinned registry copy tool
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/regclient/regclient/releases/download/v0.11.6/regctl-linux-amd64 -o "$RUNNER_TEMP/regctl"
          printf '%s  %s\n' 8e0e62a497fcdb8048d18aa927a139613176ba0531f412bc541044e28f9856bd "$RUNNER_TEMP/regctl" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/regctl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Log in to Docker Hub
        if: env.DRY_RUN != 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME || 'dizys' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Copy and verify the published release
        run: |
          args=("$RELEASE_TAG")
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          node scripts/publish-dockerhub.mjs "${args[@]}"
      - name: Save Docker Hub verification evidence
        if: success() && env.DRY_RUN != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dockerhub-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: dockerhub-verification.json
          if-no-files-found: error
          retention-days: 90
