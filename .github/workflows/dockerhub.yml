name: publish Docker Hub

on:
  push:
    branches: [main]
    paths:
      - README.md
      - docs/media/**
      - scripts/sync-dockerhub-overview.mjs
      - scripts/lib/dockerhub-overview.mjs
      - .github/workflows/dockerhub.yml
  release:
    types: [published]
  # Repair a missing or edited Overview even when no release is being made.
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Published release to copy (not needed for Overview only)
        required: false
        type: string
      overview_only:
        description: Sync the Overview without copying images or changing tags
        default: false
        type: boolean
      dry_run:
        description: Compare and validate without publishing
        default: false
        type: boolean

# Never execute code from a release tag with registry credentials. A manual
# retry always uses the current main workflow and publisher implementation.
permissions:
  contents: read

concurrency:
  group: dockerhub-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'dizys/t3code-docker' && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.overview_only))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate the release selection
        run: node --input-type=module -e "import { releaseVersion } from './scripts/lib/dockerhub-release.mjs'; releaseVersion(process.env.RELEASE_TAG || '');"
      - name: Check publishing credentials
        if: env.DRY_RUN != 'true'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo '::error::Set the DOCKERHUB_TOKEN repository secret to a Docker Hub token with read/write access to dizys/t3code-docker.'
            exit 1
          fi
      - name: Install pinned registry copy tool
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/regclient/regclient/releases/download/v0.11.6/regctl-linux-amd64 -o "$RUNNER_TEMP/regctl"
          printf '%s  %s\n' 8e0e62a497fcdb8048d18aa927a139613176ba0531f412bc541044e28f9856bd "$RUNNER_TEMP/regctl" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/regctl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Log in to Docker Hub
        if: env.DRY_RUN != 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME || 'dizys' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Copy and verify the published release
        run: |
          args=("$RELEASE_TAG")
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          node scripts/publish-dockerhub.mjs "${args[@]}"
      - name: Save Docker Hub verification evidence
        if: success() && env.DRY_RUN != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dockerhub-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: dockerhub-verification.json
          if-no-files-found: error
          retention-days: 90

  # Independent of image copying: README changes and the daily repair must not
  # require a new image release. Manual runs also use reviewed main code only.
  overview:
    if: github.repository == 'dizys/t3code-docker' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOCKERHUB_OVERVIEW_OUTPUT: dockerhub-overview.md
      DOCKERHUB_OVERVIEW_EVIDENCE: dockerhub-overview-verification.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare and compare the Overview without credentials
        run: node scripts/sync-dockerhub-overview.mjs --dry-run
      - name: Sync and verify the public Overview
        if: inputs.dry_run != true
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || 'dizys' }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: node scripts/sync-dockerhub-overview.mjs
      - name: Save Overview and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dockerhub-overview-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dockerhub-overview.md
            dockerhub-overview-verification.json
          if-no-files-found: warn
          retention-days: 90
