name: patched T3 runtime

on:
  workflow_call:
    inputs:
      bundled:
        type: boolean
        default: false
      publish:
        type: boolean
        default: false
    outputs:
      bundled:
        value: ${{ jobs.plan.outputs.bundled }}
      nightly:
        value: ${{ jobs.plan.outputs.nightly }}
  workflow_dispatch:
    inputs:
      version:
        description: Exact upstream version, or leave empty for Stable and Nightly
        type: string
      publish:
        description: Publish the tested native OCI artifacts
        type: boolean
        default: true
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      versions: ${{ steps.plan.outputs.versions }}
      revision: ${{ steps.plan.outputs.revision }}
      bundled: ${{ steps.plan.outputs.bundled }}
      nightly: ${{ steps.plan.outputs.nightly }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oras-project/setup-oras@v1
        with:
          # The action's bundled release catalog predates this official build.
          url: https://github.com/oras-project/oras/releases/download/v1.3.6/oras_1.3.6_linux_amd64.tar.gz
          checksum: 66fb0ad7206f3f6fa77ed5b552049d364ccf4b50b1684554f731f76302b52ca0
      - name: Verify the OCI publication contract offline
        run: node scripts/native-publish-smoke.mjs
      - id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NATIVE_VERSION: ${{ inputs.version }}
          NATIVE_BUNDLED: ${{ inputs.bundled }}
        run: node scripts/native-runtime-plan.mjs

  build:
    name: native ${{ matrix.version }} (${{ matrix.arch }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: t3-runtime-artifact
          platforms: linux/${{ matrix.arch }}
          outputs: type=local,dest=native-output
          build-args: T3_VERSION=${{ matrix.version }}
          cache-from: type=gha,scope=native-${{ matrix.version }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=native-${{ matrix.version }}-${{ matrix.arch }}
      - name: Verify the native project API
        env:
          NATIVE_VERSION: ${{ matrix.version }}
          NATIVE_ARCH: ${{ matrix.nodeArch }}
        run: |
          set -euo pipefail
          cd native-output
          sha256sum -c SHA256SUMS
          mkdir runtime
          tar -xzf "t3-${NATIVE_VERSION}-linux-${NATIVE_ARCH}.tar.gz" --strip-components=1 -C runtime
          cd ..
          node scripts/t3-projects-smoke.mjs native-output/runtime/t3
          node scripts/t3-integration-smoke.mjs native-output/runtime/t3
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.version }}-${{ matrix.arch }}
          path: |
            native-output/*.tar.gz
            native-output/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.repository == 'dizys/t3code-docker' && (github.event_name == 'schedule' || inputs.publish)
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: native-publish-${{ needs.plan.outputs.revision }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-artifacts
      - uses: oras-project/setup-oras@v1
        with:
          url: https://github.com/oras-project/oras/releases/download/v1.3.6/oras_1.3.6_linux_amd64.tar.gz
          checksum: 66fb0ad7206f3f6fa77ed5b552049d364ccf4b50b1684554f731f76302b52ca0
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish both tested architectures
        run: node scripts/publish-t3-runtime.mjs '${{ needs.plan.outputs.versions }}' native-artifacts
