/* T3 Code Console component stylesheet, aligned with native T3 0.1.4.
   Geometry and recipes follow upstream T3 Code (pingdotgg/t3code apps/web,
   components/ui/*): coss-ui controls on base-ui, zinc/neutral surfaces, one
   semantic action color. Shared appearance values come from tokens.css. */

/* ------------------------------------------------------------ base ---- */
.tc-root, .tc-root *, .tc-root *::before, .tc-root *::after { box-sizing: border-box; }
.tc-root {
  font-family: var(--font-sans);
  font-size: 0.875rem; line-height: 1.25rem;
  color: var(--fg); background-color: var(--bg);
  -webkit-font-smoothing: var(--font-smoothing, antialiased);
}
:where(.tc-root) :focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
:where(.tc-root a) { color: var(--accent-text); text-decoration: none; }
:where(.tc-root a:hover) { text-decoration: underline; text-underline-offset: 4px; }
.tc-mono, .tc-root code { font-family: var(--font-mono); font-size: 0.75rem; font-variant-numeric: tabular-nums; }
.tc-mono--body { font-size: 0.8125rem; }
.tc-num { font-variant-numeric: tabular-nums; }
.tc-small { font-size: 0.75rem; line-height: 1.125rem; }
.tc-muted { color: var(--fg-muted); }
.tc-subtle { color: var(--fg-subtle); }
.tc-truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.tc-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.tc-eyebrow { font-size: 0.6875rem; line-height: 0.875rem; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-muted); }
.tc-icon { width: var(--icon); height: var(--icon); flex: none; stroke-width: 2; display: inline-block; vertical-align: middle; }
.tc-icon--sm { width: 0.875rem; height: 0.875rem; }
.tc-icon--xs { width: 0.75rem; height: 0.75rem; }
.tc-icon--lg { width: 1.125rem; height: 1.125rem; }
.tc-stack { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.tc-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
.tc-spacer { flex: 1 1 auto; }
.tc-sep { color: var(--fg-subtle); }

  -webkit-mask: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjE1LjUzMDkgMzcgOTQuMzk0MSA1Ni45NiI+PHBhdGggZD0iTTMzLjQ1MDkgOTNWNDcuNTZIMTUuNTMwOVYzN0g2NC4zMzA5VjQ3LjU2SDQ2LjQxMDlWOTNIMzMuNDUwOVpNODYuNzI1MyA5My45NkM4Mi44MzIgOTMuOTYgNzguOTY1MyA5My40NTMzIDc1LjEyNTMgOTIuNDRDNzEuMjg1MyA5MS4zNzMzIDY4LjAzMiA4OS44OCA2NS4zNjUzIDg3Ljk2TDcwLjQwNTMgNzguMDRDNzIuNTM4NiA3OS41ODY3IDc1LjAxODYgODAuODEzMyA3Ny44NDUzIDgxLjcyQzgwLjY3MiA4Mi42MjY3IDgzLjUyNTMgODMuMDggODYuNDA1MyA4My4wOEM4OS42NTg2IDgzLjA4IDkyLjIxODYgODIuNDQgOTQuMDg1MyA4MS4xNkM5NS45NTIgNzkuODggOTYuODg1MyA3OC4xMiA5Ni44ODUzIDc1Ljg4Qzk2Ljg4NTMgNzMuNzQ2NyA5Ni4wNTg2IDcyLjA2NjcgOTQuNDA1MyA3MC44NEM5Mi43NTIgNjkuNjEzMyA5MC4wODUzIDY5IDg2LjQwNTMgNjlIODAuNDg1M1Y2MC40NEw5Ni4wODUzIDQyLjc2TDk3LjUyNTMgNDcuNEg2OC4xNjUzVjM3SDEwNy4zNjVWNDUuNEw5MS44NDUzIDYzLjA4TDg1LjI4NTMgNTkuMzJIODkuMDQ1M0M5NS45MjUzIDU5LjMyIDEwMS4xMjUgNjAuODY2NyAxMDQuNjQ1IDYzLjk2QzEwOC4xNjUgNjcuMDUzMyAxMDkuOTI1IDcxLjAyNjcgMTA5LjkyNSA3NS44OEMxMDkuOTI1IDc5LjAyNjcgMTA5LjA5OSA4MS45ODY3IDEwNy40NDUgODQuNzZDMTA1Ljc5MiA4Ny40OCAxMDMuMjU5IDg5LjY5MzMgOTkuODQ1MyA5MS40Qzk2LjQzMiA5My4xMDY3IDkyLjA1ODYgOTMuOTYgODYuNzI1MyA5My45NloiIGZpbGw9IiMwMDAiLz48L3N2Zz4=") center / contain no-repeat; mask: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjE1LjUzMDkgMzcgOTQuMzk0MSA1Ni45NiI+PHBhdGggZD0iTTMzLjQ1MDkgOTNWNDcuNTZIMTUuNTMwOVYzN0g2NC4zMzA5VjQ3LjU2SDQ2LjQxMDlWOTNIMzMuNDUwOVpNODYuNzI1MyA5My45NkM4Mi44MzIgOTMuOTYgNzguOTY1MyA5My40NTMzIDc1LjEyNTMgOTIuNDRDNzEuMjg1MyA5MS4zNzMzIDY4LjAzMiA4OS44OCA2NS4zNjUzIDg3Ljk2TDcwLjQwNTMgNzguMDRDNzIuNTM4NiA3OS41ODY3IDc1LjAxODYgODAuODEzMyA3Ny44NDUzIDgxLjcyQzgwLjY3MiA4Mi42MjY3IDgzLjUyNTMgODMuMDggODYuNDA1MyA4My4wOEM4OS42NTg2IDgzLjA4IDkyLjIxODYgODIuNDQgOTQuMDg1MyA4MS4xNkM5NS45NTIgNzkuODggOTYuODg1MyA3OC4xMiA5Ni44ODUzIDc1Ljg4Qzk2Ljg4NTMgNzMuNzQ2NyA5Ni4wNTg2IDcyLjA2NjcgOTQuNDA1MyA3MC44NEM5Mi43NTIgNjkuNjEzMyA5MC4wODUzIDY5IDg2LjQwNTMgNjlIODAuNDg1M1Y2MC40NEw5Ni4wODUzIDQyLjc2TDk3LjUyNTMgN .tc-wordmark > span { color: var(--fg-muted); }

/* Brand masthead: upstream AuthSurfaceShell (stage gradient, radial light,
   bottom shade) with the mark's blueprint grid drawn in stage-line. */
.tc-masthead { position: relative; height: 6rem; overflow: hidden; color: var(--on-stage);
  background:
    radial-gradient(circle at 75% 25%, rgb(136 204 255 / 0.5), transparent 38%),
    linear-gradient(135deg, var(--stage-mid), var(--stage-bottom)); }
.tc-masthead::before { content: ""; position: absolute; inset: 0;
  background-image:
    linear-gradient(color-mix(in srgb, var(--stage-line) 30%, transparent) 1px, transparent 1px),
    linear-gradient(90deg, color-mix(in srgb, var(--stage-line) 30%, transparent) 1px, transparent 1px),
    linear-gradient(color-mix(in srgb, var(--stage-line) 12%, transparent) 1px, transparent 1px),
    linear-gradient(90deg, color-mix(in srgb, var(--stage-line) 12%, transparent) 1px, transparent 1px);
  background-size: 16px 16px, 16px 16px, 4px 4px, 4px 4px;
  -webkit-mask-image: linear-gradient(105deg, transparent 30%, #000 85%); mask-image: linear-gradient(105deg, transparent 30%, #000 85%); }
.tc-masthead::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 20%, rgb(7 18 55 / 0.46) 100%); }
.tc-masthead > * { position: relative; z-index: 1; }
.tc-masthead .tc-eyebrow { color: color-mix(in srgb, var(--on-stage) 80%, transparent); letter-spacing: 0.1em; font-size: 0.625rem; }

/* Standalone page: upstream StandalonePage (radial glow at top, angled shade). */
.tc-standalone { position: relative; overflow: hidden; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 2.5rem 1.5rem; }
.tc-standalone::before { content: ""; position: absolute; inset: 0; opacity: 0.8; pointer-events: none;
  background:
    radial-gradient(48rem 20rem at top, color-mix(in srgb, var(--info) 12%, transparent), transparent),
    linear-gradient(145deg, color-mix(in srgb, var(--bg) 94%, #000) 0%, var(--bg) 62%); }
.tc-standalone[data-tone="pairing"]::before {
  background:
    radial-gradient(44rem 16rem at top, color-mix(in srgb, var(--ok) 14%, transparent), transparent),
    radial-gradient(28rem 18rem at left, color-mix(in srgb, oklch(0.685 0.169 237.323) 10%, transparent), transparent),
    linear-gradient(145deg, color-mix(in srgb, var(--bg) 90%, #000) 0%, var(--bg) 55%); }
.tc-standalone-card { position: relative; width: 100%; max-width: 36rem; border-radius: var(--radius-2xl); border: 1px solid color-mix(in srgb, var(--border) 80%, transparent);
  background: color-mix(in srgb, var(--surface) 94%, transparent); box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.2); backdrop-filter: blur(12px); overflow: hidden; }
.tc-standalone-body { padding: 2rem; display: flex; flex-direction: column; gap: 0; }
.tc-standalone-title { margin: 0.75rem 0 0; font-size: 1.5rem; line-height: 2rem; font-weight: 600; letter-spacing: -0.025em; text-wrap: balance; }
.tc-standalone-desc { margin: 0.5rem 0 0; font-size: 0.875rem; line-height: 1.625; color: var(--fg-muted); }
.tc-note { border-radius: var(--radius-lg); border: 1px solid color-mix(in srgb, var(--border) 70%, transparent); background: color-mix(in srgb, var(--bg) 55%, transparent); padding: 0.75rem; font-size: 0.75rem; line-height: 1.625; color: var(--fg-muted); }

/* Brand glow on a group (Readiness, pairing): upstream "brand" tone, contained. */
.tc-group--brand { position: relative; overflow: hidden; }
.tc-group--brand::before { content: ""; position: absolute; inset: 0 0 auto; height: 11rem; pointer-events: none;
  background: radial-gradient(40rem 11rem at top, color-mix(in srgb, var(--info) 12%, transparent), transparent); }
.tc-group--brand > * { position: relative; }

/* ----------------------------------------------------------- buttons -- */
/* Upstream Button (coss-ui): border on every variant, 8px radius, medium 14px,
   press scale .97, 2px ring offset 1px, disabled 64%. */
.tc-btn {
  --_h: var(--control-md); --_icon: var(--fg-muted);
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; flex: none;
  height: var(--_h); padding: 0 0.6875rem; border-radius: var(--radius-md); border: 1px solid transparent;
  font: inherit; font-size: 0.875rem; font-weight: 500; line-height: 1; white-space: nowrap;
  color: var(--fg); background: transparent; cursor: pointer; user-select: none; text-decoration: none !important;
  transition: background-color var(--dur-fast), border-color var(--dur-fast), box-shadow var(--dur-fast), scale var(--dur-fast);
}
.tc-btn .tc-icon { width: 1rem; height: 1rem; margin: 0 -2px; color: var(--_icon); }
.tc-btn:active:not([aria-haspopup]) { scale: 0.97; }
.tc-btn:disabled, .tc-btn[aria-disabled="true"] { opacity: var(--opacity-disabled); pointer-events: none; }
:where(.tc-root) .tc-btn:focus-visible { outline: none; box-shadow: inset 0 0 0 1px var(--bg), inset 0 0 0 3px var(--focus); }
/* default = upstream "outline" */
.tc-btn, .tc-btn--outline, .tc-btn--secondary { border-color: var(--border-strong); background: var(--surface); box-shadow: var(--shadow-xs); }
.tc-btn:hover, .tc-btn--outline:hover, .tc-btn--secondary:hover { background: color-mix(in srgb, var(--hover) 50%, var(--surface)); }
[data-theme="dark"] .tc-btn:not(.tc-btn--primary):not(.tc-btn--ghost):not(.tc-btn--danger-solid):not(.tc-btn--link):not(.tc-btn--warning) { background: color-mix(in srgb, var(--border-strong) 32%, transparent); }
[data-theme="dark"] .tc-btn:not(.tc-btn--primary):not(.tc-btn--ghost):not(.tc-btn--danger-solid):not(.tc-btn--link):not(.tc-btn--warning):hover { background: color-mix(in srgb, var(--border-strong) 64%, transparent); }
.tc-btn--primary { border-color: var(--accent); background: var(--accent); color: var(--on-accent); box-shadow: var(--shadow-primary); --_icon: currentColor; }
.tc-btn--primary:hover { background: var(--accent-hover); }
.tc-btn--primary:active { box-shadow: inset 0 1px 0 rgb(0 0 0 / 0.08); }
.tc-btn--ghost { border-color: transparent; background: transparent; box-shadow: none; }
.tc-btn--ghost:hover { background: var(--hover); }
.tc-btn--ghost-muted { color: var(--fg-muted); --_icon: currentColor; }
.tc-btn--ghost-muted:hover { color: var(--fg); }
.tc-btn--danger { color: var(--danger-text); --_icon: currentColor; }
.tc-btn--danger:hover { border-color: color-mix(in srgb, var(--danger) 32%, transparent); background: color-mix(in srgb, var(--danger) 4%, var(--surface)); }
.tc-btn--danger-solid { border-color: var(--danger); background: var(--danger); color: var(--on-danger); box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.16); --_icon: currentColor; }
.tc-btn--danger-solid:hover { background: color-mix(in srgb, var(--danger) 90%, var(--bg)); }
.tc-btn--warning { border-color: color-mix(in srgb, var(--warn) 32%, transparent); background: var(--warn-soft); color: var(--warn-text); box-shadow: none; --_icon: currentColor; }
.tc-btn--link { border-color: transparent; background: none; box-shadow: none; padding: 0; height: auto; color: var(--fg); }
.tc-btn--link:hover { text-decoration: underline !important; text-underline-offset: 4px; background: none; }
.tc-btn--xs { --_h: var(--control-xs); padding: 0 0.4375rem; gap: 0.25rem; font-size: 0.75rem; }
.tc-btn--xs .tc-icon { width: 0.875rem; height: 0.875rem; }
.tc-btn--sm { --_h: var(--control-sm); padding: 0 0.5625rem; gap: 0.375rem; }
.tc-btn--lg { --_h: var(--control-lg); padding: 0 0.8125rem; }
.tc-btn--icon { padding: 0; width: var(--_h); }
.tc-btn--block { width: 100%; }
.tc-btn .tc-kbd { margin-right: -0.25rem; }
.tc-btn--primary .tc-kbd { background: rgb(255 255 255 / 0.16); color: var(--on-accent); }
.tc-btn[data-busy] { pointer-events: none; }
.tc-btn[data-busy] > .tc-icon:first-child { animation: tc-spin 0.9s linear infinite; }
.tc-btngroup { display: inline-flex; }
.tc-btngroup > .tc-btn:not(:last-child) { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.tc-btngroup > .tc-btn:not(:first-child) { border-top-left-radius: 0; border-bottom-left-radius: 0; margin-left: -1px; }

/* Native buttons keep a 44px hit area on coarse pointers without enlarging
   every visible control. This also holds at the minimum native font size. */
@media (pointer: coarse) {
  .tc-btn::after { content: ""; position: absolute; top: 50%; left: 50%; translate: -50% -50%; width: 100%; height: 100%; min-width: 44px; min-height: 44px; }
}

/* --------------------------------------------------------------- kbd -- */
/* Upstream Kbd: muted fill, no border, sans, 20px. */
.tc-kbd { display: inline-flex; align-items: center; justify-content: center; gap: 0.25rem; min-width: 1.25rem; height: 1.25rem; padding: 0 0.25rem;
  border-radius: var(--radius-xs); background: var(--surface-sunken); color: var(--fg-muted); font: 500 0.75rem/1 var(--font-sans); }
[data-theme="dark"] .tc-kbd { background: color-mix(in srgb, var(--fg) 6%, transparent); }
.tc-kbdgroup { display: inline-flex; align-items: center; gap: 0.25rem; }

/* ------------------------------------------------------------- forms -- */
.tc-field { display: flex; flex-direction: column; gap: 0.5rem; min-width: 0; }
.tc-label { font-size: 0.875rem; font-weight: 500; color: var(--fg); }
.tc-label-opt { font-weight: 400; color: var(--fg-muted); margin-left: 0.25rem; }
.tc-hint { font-size: 0.75rem; line-height: 1.125rem; color: var(--fg-muted); margin: 0; }
.tc-hint--err { color: var(--danger-text); }
/* Upstream Input: 10px radius wrapper, border-input, bg-background, shadow-xs/5, 30px tall. */
.tc-input, .tc-select {
  height: var(--input); width: 100%; min-width: 0; padding: 0 0.6875rem;
  border: 1px solid var(--border-strong); border-radius: var(--radius-lg);
  background: var(--bg); color: var(--fg); box-shadow: var(--shadow-xs);
  font: inherit; font-size: 0.875rem; transition: border-color var(--dur-fast), box-shadow var(--dur-fast);
}
[data-theme="dark"] .tc-input, [data-theme="dark"] .tc-select { background-color: color-mix(in srgb, var(--border-strong) 32%, transparent); }
.tc-input::placeholder { color: var(--fg-subtle); opacity: 1; }
.tc-input:focus, .tc-select:focus { outline: none; border-color: var(--focus); box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--focus) 24%, transparent); }
.tc-input[aria-invalid="true"] { border-color: color-mix(in srgb, var(--danger) 36%, transparent); }
.tc-input[aria-invalid="true"]:focus { box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--danger) 16%, transparent); }
.tc-input--mono { font-family: var(--font-mono); font-size: 0.8125rem; }
.tc-input--lg { height: 2.125rem; }
.tc-inputwrap { position: relative; display: flex; align-items: center; min-width: 0; }
.tc-inputwrap > .tc-icon { position: absolute; left: 0.625rem; color: var(--fg-muted); pointer-events: none; }
.tc-inputwrap > .tc-icon ~ .tc-input { padding-left: 2rem; }
.tc-inputwrap > .tc-btn { position: absolute; right: 0.1875rem; }
.tc-select { appearance: none; padding-right: 1.875rem;
  background-image: linear-gradient(45deg, transparent 50%, var(--fg-muted) 50%), linear-gradient(135deg, var(--fg-muted) 50%, transparent 50%);
  background-position: calc(100% - 15px) 50%, calc(100% - 11px) 50%; background-size: 4px 4px; background-repeat: no-repeat; }
/* Native <select> popups are drawn by the OS. On Windows the list keeps the
   OS theme unless the control opts into the page's scheme and its options
   carry the theme's own colours; without this a dark page opens a white list. */
.tc-input, .tc-select { color-scheme: light; }
[data-theme="dark"] .tc-input, [data-theme="dark"] .tc-select { color-scheme: dark; }
.tc-input option, .tc-select option, .tc-input optgroup, .tc-select optgroup { background: var(--surface-raised); color: var(--fg); }
/* Forced colours remove the painted chevron and shadow-based focus ring.
   Keep the native indicator and a system-colour outline in high contrast. */
@media (forced-colors: active) {
  .tc-select { appearance: auto; background-image: none; padding-right: 0.6875rem; }
  .tc-select:focus { outline: 2px solid Highlight; outline-offset: 2px; }
}

/* copy field */
.tc-copyfield { display: flex; align-items: center; min-width: 0; gap: 2px; padding: 2px 2px 2px 0;
  border: 1px solid var(--border-strong); border-radius: var(--radius-lg); background: var(--surface-sunken); }
.tc-copyfield-value { flex: 1 1 auto; min-width: 0; padding: 0.25rem 0.625rem; font: 400 0.8125rem/1.25rem var(--font-mono); color: var(--fg);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; user-select: all; }
.tc-copyfield[data-wrap] .tc-copyfield-value { white-space: normal; word-break: break-all; max-height: 5rem; overflow: auto; }
.tc-copyfield-actions { display: flex; align-items: center; gap: 2px; }
.tc-copyfield-actions .tc-btn { height: 1.625rem; }
.tc-copyfield--code .tc-copyfield-value { font-size: 1.375rem; line-height: 1.75rem; font-weight: 500; letter-spacing: 0.08em; padding: 0.625rem 0.875rem; text-align: center; }

/* segmented control (upstream toggle-group look) */
.tc-seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: var(--radius-md); background: var(--surface-sunken); border: 1px solid color-mix(in srgb, var(--border) 60%, transparent); }
.tc-seg button { height: 1.5rem; padding: 0 0.5625rem; border: 0; border-radius: 0.375rem; background: transparent; color: var(--fg-muted);
  font: inherit; font-size: 0.75rem; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 0.25rem; }
.tc-seg button:hover { color: var(--fg); }
.tc-seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / 0.08), 0 0 0 1px color-mix(in srgb, var(--border) 80%, transparent); }
[data-theme="dark"] .tc-seg button[aria-pressed="true"] { background: color-mix(in srgb, var(--border-strong) 72%, transparent); box-shadow: none; }

/* switch: upstream thumb 14px, track primary/input */
.tc-switch { --_t: 1rem; position: relative; width: calc(var(--_t) * 2 - 2px); height: calc(var(--_t) + 2px); flex: none; border-radius: var(--radius-full); border: 0; padding: 2px;
  background: var(--border-strong); cursor: pointer; transition: background-color 200ms; }
[data-theme="dark"] .tc-switch { background: var(--border-strong); }
.tc-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: calc(var(--_t) - 2px); height: calc(var(--_t) - 2px); border-radius: 50%; background: var(--bg);
  box-shadow: 0 1px 2px rgb(0 0 0 / 0.1); transition: translate 150ms; }
[data-theme="dark"] .tc-switch[aria-checked="false"]::after { background: var(--fg-muted); }
.tc-switch[aria-checked="true"] { background: var(--accent); }
.tc-switch[aria-checked="true"]::after { translate: calc(var(--_t) - 4px) 0; }
:where(.tc-root) .tc-switch:focus-visible { outline: none; box-shadow: inset 0 0 0 1px var(--bg), inset 0 0 0 3px var(--focus); }
@media (forced-colors: active) {
  :where(.tc-root) :is(.tc-btn, .tc-switch):focus-visible, .tc-input:focus, .tc-select:focus { outline: 2px solid Highlight; outline-offset: -2px; }
}

/* listbox */
.tc-listbox { list-style: none; margin: 0; padding: 0.25rem var(--space-2); display: flex; flex-direction: column; gap: 1px; max-height: 17.5rem; overflow: auto; }
.tc-option { display: flex; align-items: center; gap: 0.5rem; min-height: 2rem; padding: 0.375rem 0.5rem; border-radius: var(--radius-sm); cursor: pointer; color: var(--fg); font-size: 0.875rem; }
.tc-option:hover { background: var(--selected); }
.tc-option[aria-selected="true"] { background: var(--highlighted); }
.tc-option > .tc-icon { color: var(--fg-muted); opacity: 0.8; }
.tc-option-meta { margin-left: auto; color: var(--fg-muted); font-size: 0.75rem; display: flex; gap: 0.25rem; align-items: center; }
.tc-option mark { background: none; color: inherit; font-weight: 600; }
.tc-listbox-group { padding: 0.5rem 0.5rem 0.25rem; font-size: 0.75rem; font-weight: 500; color: var(--fg-muted); }

/* ------------------------------------------------------------ status -- */
.tc-dot { width: 0.375rem; height: 0.375rem; border-radius: 50%; flex: none; background: currentColor; display: inline-block; }
.tc-dot--ok { color: var(--ok); } .tc-dot--warn { color: var(--warn); } .tc-dot--danger { color: var(--danger); }
.tc-dot--info { color: var(--info); } .tc-dot--idle { color: var(--idle); }
.tc-dot--live { position: relative; }
.tc-dot--live::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: currentColor; animation: tc-ping 2s infinite; }
.tc-dot--pulse { animation: tc-pulse 2s infinite; }

/* Upstream Badge: 6px radius, 18px tall, 12px medium, 8%/16% tints, no dot. */
.tc-badge, .tc-chip {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.25rem; height: 1.125rem; min-width: 1.125rem; padding: 0 0.3125rem;
  border-radius: var(--radius-sm); border: 1px solid transparent; font-size: 0.75rem; font-weight: 500; line-height: 1; white-space: nowrap;
  background: var(--surface-sunken); color: var(--fg);
}
.tc-badge .tc-icon, .tc-chip .tc-icon { width: 0.75rem; height: 0.75rem; opacity: 0.8; }
.tc-badge--ok, .tc-chip--ok { background: var(--ok-soft); color: var(--ok-text); }
.tc-badge--warn, .tc-chip--warn { background: var(--warn-soft); color: var(--warn-text); }
.tc-badge--danger, .tc-chip--danger { background: var(--danger-soft); color: var(--danger-text); }
.tc-badge--info, .tc-chip--info { background: var(--info-soft); color: var(--info-text); }
.tc-badge--outline { border-color: var(--border-strong); background: var(--bg); color: var(--fg); }
[data-theme="dark"] .tc-badge--outline { background: color-mix(in srgb, var(--border-strong) 32%, transparent); }

/* status line: upstream provider row — only trouble gets a dot */
.tc-status { display: flex; align-items: flex-start; gap: 0.375rem; font-size: 0.75rem; line-height: 1.125rem; color: var(--fg-muted); min-width: 0; flex-wrap: wrap; }

/* Monogram: upstream ProjectMonogram — mono bold ink on a 14% tint of itself, 25% radius. */

  color: var(--_tile, var(--id-toolchain)); background: color-mix(in srgb, var(--_tile, var(--id-toolchain)) 14%, transparent);
  font: 700 0.5625rem/1 var(--font-mono); letter-spacing: -0.02em; position: relative; }

.tc-tile .tc-tile-badge { position: absolute; right: -2px; bottom: -2px; width: 0.4375rem; height: 0.4375rem; border-radius: 50%; border: 1.5px solid var(--surface); background: var(--ok); }

/* ---------------------------------------------------------- progress -- */
.tc-progress { height: 0.25rem; border-radius: var(--radius-xs); background: var(--hover); overflow: hidden; position: relative; }

.tc-spinner { width: 0.875rem; height: 0.875rem; flex: none; border-radius: 50%; border: 1.75px solid currentColor; border-right-color: transparent; animation: tc-spin 0.75s linear infinite; display: inline-block; opacity: 0.85; }
.tc-op { display: grid; grid-template-columns: 1fr auto; gap: 0.375rem 0.75rem; align-items: center; font-size: 0.875rem; }

/* ------------------------------------------------------------ groups --- */
/* Upstream settings: a sentence-case label above a quiet grouped list. */
.tc-section { display: flex; flex-direction: column; gap: var(--space-2-5); min-width: 0; }
.tc-section-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; min-height: 1.75rem; padding: 0 var(--space-4); }
.tc-section-title { display: flex; align-items: center; gap: 0.5rem; min-height: 1.75rem; margin: 0; font-size: 1rem; line-height: 1.5rem; font-weight: 600; color: var(--fg-section); }

.tc-group, .tc-card { position: relative; border-radius: var(--radius-xl); border: 1px solid var(--group-border);
  background: var(--group-bg); box-shadow: 0 1px 2px rgb(0 0 0 / 0.05); color: var(--fg); min-width: 0; }

.tc-card-body { padding: var(--space-4); }
.tc-card-foot { display: flex; align-items: center; gap: var(--space-2); padding: 0.625rem var(--space-4); border-top: 1px solid var(--hairline); font-size: 0.75rem; color: var(--fg-muted);
  background: color-mix(in srgb, var(--fg) 2.5%, transparent); border-radius: 0 0 calc(var(--radius-xl) - 1px) calc(var(--radius-xl) - 1px); }
.tc-group-head { display: flex; align-items: center; gap: 0.5rem; padding: 0.75rem var(--space-4) 0.25rem; font-size: 0.75rem; font-weight: 500; color: var(--fg-muted); }

/* rows: upstream settings-row / provider list row */
.tc-list { display: flex; flex-direction: column; }

.tc-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 2px var(--space-3);
  min-height: 4rem; padding: var(--space-3) var(--space-4); position: relative; transition: background-color var(--dur-fast); }

.tc-row--compact { min-height: 3.25rem; padding-block: 0.625rem; }

.tc-row-main { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.tc-row-title { display: flex; align-items: center; gap: 0.5rem; min-width: 0; flex-wrap: wrap; }

.tc-row--expanded { background: color-mix(in srgb, var(--surface-sunken) 45%, transparent); }

/* readouts */
.tc-readouts { display: grid; grid-template-columns: repeat(auto-fit, minmax(9.375rem, 1fr)); }
.tc-readout { display: flex; flex-direction: column; gap: 2px; padding: 0.75rem var(--space-4); min-width: 0; border-left: 1px solid var(--hairline); }

/* -------------------------------------------------------- readiness -- */
.tc-ready { display: grid; gap: 0.5rem; padding: 1.25rem var(--space-4) 1rem; }
.tc-ready-head { display: flex; align-items: flex-end; gap: var(--space-4); flex-wrap: wrap; }

.tc-checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 1px solid var(--hairline); }
.tc-check { display: grid; grid-template-columns: 1.25rem minmax(0, 1fr) auto; gap: 2px var(--space-3); align-items: center; padding: 0.75rem var(--space-4); }
.tc-check + .tc-check { border-top: 1px solid var(--hairline); }
.tc-check-mark { width: 1.25rem; height: 1.25rem; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--border-strong); color: var(--fg-muted); font: 500 0.6875rem/1 var(--font-mono); }

.tc-check > .tc-btn, .tc-check > .tc-check-aside { grid-column: 3; grid-row: 1 / span 2; }

/* ------------------------------------------------------------ stepper -- */
.tc-steps { display: flex; align-items: center; gap: 0.5rem; list-style: none; margin: 0; padding: 0; min-width: 0; }
.tc-step { display: flex; align-items: center; gap: 0.5rem; font-size: 0.75rem; font-weight: 500; color: var(--fg-muted); white-space: nowrap; }
.tc-step-mark { width: 1.125rem; height: 1.125rem; border-radius: 50%; display: grid; place-items: center; font: 500 0.625rem/1 var(--font-mono); border: 1px solid var(--border-strong); flex: none; }
.tc-step-mark .tc-icon { width: 0.6875rem; height: 0.6875rem; stroke-width: 3; }

/* ---------------------------------------------------------------- qr -- */
.tc-qr { display: inline-grid; place-items: center; padding: 0.625rem; border-radius: var(--radius-xl); background: var(--qr-ground); border: 1px solid color-mix(in srgb, var(--border) 60%, transparent); box-shadow: var(--shadow-xs); flex: none; }

/* -------------------------------------------------------------- alert -- */
/* Upstream Alert: 14px radius, bordered, 14/12 padding. */
.tc-notice { display: flex; gap: 0.625rem; align-items: flex-start; padding: 0.75rem 0.875rem; border-radius: var(--radius-xl); border: 1px solid var(--border); font-size: 0.875rem; line-height: 1.25rem; color: var(--fg); background: transparent; }

.tc-notice--info { border-color: color-mix(in srgb, var(--info) 32%, transparent); background: color-mix(in srgb, var(--info) 4%, transparent); }
.tc-notice--info > .tc-icon { color: var(--info); }
.tc-notice--ok { border-color: color-mix(in srgb, var(--ok) 32%, transparent); background: color-mix(in srgb, var(--ok) 4%, transparent); }
.tc-notice--ok > .tc-icon { color: var(--ok); }

.tc-notice--danger > .tc-icon { color: var(--danger); }
[data-theme="dark"] .tc-notice--warn { background: var(--warn-soft); } [data-theme="dark"] .tc-notice--danger { background: var(--danger-soft); }
.tc-notice .tc-btn { margin: -0.25rem -0.375rem -0.25rem 0; }
.tc-banner { display: flex; align-items: center; gap: 0.625rem; min-height: 2.25rem; padding: 0.375rem var(--space-6); font-size: 0.75rem; color: var(--fg-muted); border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent); }

/* -------------------------------------------------------------- empty -- */
.tc-empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 0.25rem; padding: 2.5rem var(--space-6); }

.tc-empty-media::after { rotate: 10deg; translate: 2px 0; transform-origin: bottom right; }
.tc-empty-icon { position: relative; z-index: 1; width: 2.25rem; height: 2.25rem; border-radius: var(--radius-md); display: grid; place-items: center; background: var(--surface); border: 1px solid var(--border);
  box-shadow: 0 1px 2px rgb(0 0 0 / 0.05); color: var(--fg); }

.tc-empty-desc { font-size: 0.8125rem; line-height: 1.125rem; color: var(--fg-muted); }

.tc-empty--compact { padding: 0.875rem var(--space-4); flex-direction: row; flex-wrap: wrap; align-items: baseline; text-align: left; column-gap: 0.5rem; row-gap: 2px; font-size: 0.75rem; color: var(--fg-muted); }
.tc-empty--compact .tc-empty-title { font-size: 0.875rem; line-height: 1.25rem; }
/* With an icon: the icon beside the title and the line under it, so a phone
   wraps the sentence rather than the title. The fanned cards reach past the

.tc-empty--compact:has(> .tc-empty-media) { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; column-gap: 0.375rem; }
.tc-empty--compact > .tc-empty-media { grid-row: 1 / span 2; margin: 0 0.5rem 0 0.375rem; }

/* --------------------------------------------------------- floating -- */
/* Glass: upstream dropdown-glass / dialog-glass. */
.tc-glass { background: color-mix(in srgb, var(--surface-raised) 18%, color-mix(in srgb, var(--surface-raised) 80%, transparent));
  -webkit-backdrop-filter: blur(12px) saturate(1.14); backdrop-filter: blur(12px) saturate(1.14);

.tc-menu { min-width: 12.5rem; padding: 0.25rem; border-radius: var(--radius-lg); box-shadow: var(--shadow-popup); z-index: var(--z-menu);
  background: color-mix(in srgb, var(--surface-raised) 18%, color-mix(in srgb, var(--surface-raised) 80%, transparent));
  -webkit-backdrop-filter: blur(12px) saturate(1.14); backdrop-filter: blur(12px) saturate(1.14); border: 1px solid color-mix(in srgb, var(--fg) 10%, transparent); }
[data-theme="dark"] .tc-menu { border-color: var(--border); }
.tc-menu-item { display: flex; align-items: center; gap: 0.5rem; width: 100%; min-height: 1.75rem; padding: 0.25rem 0.5rem; border: 0; border-radius: var(--radius-sm);
  background: transparent; color: var(--fg); font: inherit; font-size: 0.875rem; text-align: left; cursor: pointer; }
.tc-menu-item:hover, .tc-menu-item:focus-visible { background: var(--hover); outline: none; }
.tc-menu-item > .tc-icon { color: var(--fg-muted); opacity: 0.8; margin: 0 -2px; }

.tc-menu-sep { height: 1px; margin: 0.25rem 0; background: var(--border); border: 0; }

.tc-backdrop { position: fixed; inset: 0; background: var(--backdrop); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); z-index: var(--z-overlay); }
.tc-dialog { width: min(448px, calc(100% - 32px)); border-radius: var(--radius-2xl); overflow: hidden; box-shadow: var(--shadow-dialog);
  background: color-mix(in srgb, var(--bg) 80%, transparent); -webkit-backdrop-filter: blur(12px) saturate(1.14); backdrop-filter: blur(12px) saturate(1.14);
  border: 1px solid color-mix(in srgb, var(--fg) 10%, transparent); }
[data-theme="dark"] .tc-dialog { border-color: var(--border); }
.tc-dialog-body { padding: 1.5rem 1.5rem 1rem; display: flex; flex-direction: column; gap: 0.5rem; }

.tc-dialog-desc { font-size: 0.875rem; line-height: 1.25rem; color: var(--fg-muted); margin: 0; }
.tc-dialog-foot { display: flex; justify-content: flex-end; gap: 0.5rem; padding: 0.75rem 1.5rem 1.25rem; }

.tc-sheet { display: flex; flex-direction: column; width: var(--sheet); max-width: 100%; background: var(--surface-raised); border-left: 1px solid var(--border); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.05); }
.tc-sheet--inset { border: 1px solid var(--border); border-radius: var(--radius-2xl); overflow: hidden; }
.tc-sheet-head { display: flex; align-items: center; gap: 0.625rem; padding: 1rem 1rem 0.75rem 1.25rem; }
.tc-sheet-title { font-size: 1.0625rem; line-height: 1.5rem; font-weight: 600; margin: 0; }
.tc-sheet-body { padding: 0.25rem 1.25rem 1.25rem; display: flex; flex-direction: column; gap: 1.25rem; overflow: auto; }
.tc-sheet-foot { margin-top: auto; display: flex; gap: 0.5rem; justify-content: flex-end; align-items: center; padding: 0.75rem 1.25rem; border-top: 1px solid var(--border); background: color-mix(in srgb, var(--fg) 2.5%, transparent); }
.tc-sheet--bottom { width: 100%; border-left: 0; border-top: 1px solid var(--border); border-radius: var(--radius-2xl) var(--radius-2xl) 0 0; }
.tc-sheet--bottom::before { content: ""; width: 2.25rem; height: 0.25rem; border-radius: 2px; background: var(--border-strong); margin: 0.5rem auto 0; }
.tc-sheet-step { display: grid; grid-template-columns: 1.125rem minmax(0, 1fr); gap: 0.25rem 0.75rem; }
.tc-sheet-step > .tc-step-mark { color: var(--fg-muted); margin-top: 1px; }
.tc-sheet-step[data-state="active"] > .tc-step-mark { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.tc-sheet-step[data-state="done"] > .tc-step-mark { background: var(--ok-soft); color: var(--ok-text); border-color: transparent; }
.tc-sheet-step-body { display: flex; flex-direction: column; gap: 0.625rem; min-width: 0; }
.tc-sheet-step-title { font-weight: 500; line-height: 1.25rem; font-size: 0.875rem; }

/* Command palette: upstream command.tsx — 18px-radius glass, quiet selection, tinted footer. */
.tc-palette { width: min(576px, calc(100% - 32px)); border-radius: var(--radius-2xl); overflow: hidden; box-shadow: var(--shadow-dialog);
  background: color-mix(in srgb, var(--bg) 80%, transparent); -webkit-backdrop-filter: blur(12px) saturate(1.14); backdrop-filter: blur(12px) saturate(1.14);
  border: 1px solid color-mix(in srgb, var(--fg) 10%, transparent); }
[data-theme="dark"] .tc-palette { border-color: var(--border); }
.tc-palette-input { display: flex; align-items: center; gap: 0.625rem; padding: 0 1rem; height: 3rem; }
.tc-palette-input input { flex: 1; border: 0; background: transparent; font: inherit; font-size: 1rem; color: var(--fg); outline: none; min-width: 0; }
.tc-palette-input input::placeholder { color: var(--fg-muted); }
.tc-palette .tc-listbox { padding: 2px 0.5rem 0.5rem; }
.tc-palette-foot { display: flex; gap: 1rem; align-items: center; padding: 0.625rem 1rem; font-size: 0.875rem; font-weight: 500; color: var(--fg-muted); background: color-mix(in srgb, var(--fg) 2.5%, transparent); }
.tc-palette-foot span { display: inline-flex; gap: 0.375rem; align-items: center; }
.tc-palette-foot .tc-kbd { background: color-mix(in srgb, var(--fg) 8%, transparent); color: var(--fg); }

.tc-toast { display: flex; align-items: center; gap: 0.625rem; min-height: var(--touch); padding: 0.625rem 0.75rem 0.625rem 0.875rem; width: max-content; max-width: min(380px, calc(100vw - 32px));
  border-radius: var(--radius-lg); box-shadow: var(--shadow-toast); font-size: 0.875rem; color: var(--fg);
  background: color-mix(in srgb, var(--surface-raised) 18%, color-mix(in srgb, var(--surface-raised) 80%, transparent));
  -webkit-backdrop-filter: blur(12px) saturate(1.14); backdrop-filter: blur(12px) saturate(1.14); border: 1px solid color-mix(in srgb, var(--fg) 10%, transparent);
  animation: tc-rise var(--dur-toast) cubic-bezier(0.22, 1, 0.36, 1); }
[data-theme="dark"] .tc-toast { border-color: var(--border); }
.tc-toast > .tc-icon { color: var(--ok); }
.tc-toast[data-tone="danger"] > .tc-icon { color: var(--danger); }
.tc-toast[data-tone="warn"] > .tc-icon { color: var(--warn); }
.tc-toast[data-tone="info"] > .tc-icon { color: var(--info); }
.tc-toast-text { display: flex; flex-direction: column; min-width: 0; }
.tc-toast-text small { font-size: 0.75rem; color: var(--fg-muted); }
.tc-tooltip { display: inline-flex; gap: 0.5rem; align-items: center; padding: 0.25rem 0.5rem; border-radius: var(--radius-md); background: var(--surface-raised); color: var(--fg); font-size: 0.75rem; line-height: 1rem;
  border: 1px solid var(--border); box-shadow: 0 1px 2px rgb(0 0 0 / 0.04), 0 4px 12px -4px rgb(0 0 0 / 0.12); }

/* -------------------------------------------------------------- shell -- */
.tc-app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: 100%; background: var(--bg); }
.tc-sidebar { position: relative; display: flex; flex-direction: column; gap: 0.5rem; padding: 0.5rem; border-right: 1px solid var(--sidebar-border); background: var(--sidebar); color: var(--sidebar-fg); min-height: 100%; }
.tc-brand { display: flex; align-items: center; gap: 0.5rem; height: 1.75rem; padding: 0 0.5rem; margin: 0.25rem 0 0.25rem; }
.tc-brand-name { font-weight: 500; font-size: 0.875rem; letter-spacing: -0.01em; }
.tc-brand-sub { font-size: 0.75rem; color: var(--fg-muted); }
.tc-search { display: flex; align-items: center; gap: 0.5rem; height: 2rem; padding: 0 0.5rem; border: 0; border-radius: var(--radius-md); background: transparent;
  color: var(--sidebar-fg-muted); font: inherit; font-size: 0.875rem; font-weight: 500; cursor: pointer; width: 100%; }
.tc-search:hover { background: var(--sidebar-row-hover); color: var(--fg); }
.tc-search > .tc-icon { color: color-mix(in srgb, var(--sidebar-fg-muted) 80%, transparent); }
.tc-search .tc-kbd { margin-left: auto; background: transparent; color: var(--fg-muted); }
.tc-nav { display: flex; flex-direction: column; gap: 0.25rem; }
.tc-nav-label { padding: 0.75rem 0.625rem 0.25rem; font-size: 0.75rem; font-weight: 500; color: var(--sidebar-fg-muted); }
.tc-nav-item { display: flex; align-items: center; gap: 0.5rem; height: 2rem; padding: 0 0.625rem; border-radius: var(--radius-md); border: 0; background: transparent; width: 100%;
  color: var(--sidebar-fg-muted); font: inherit; font-size: 0.875rem; font-weight: 500; text-decoration: none !important; cursor: pointer; }
.tc-nav-item > .tc-icon { color: currentColor; }
.tc-nav-item:hover { background: var(--sidebar-row-hover); color: var(--sidebar-fg); }
.tc-nav-item:hover > .tc-icon { color: var(--sidebar-fg); }
.tc-nav-item[aria-current="page"] { background: var(--sidebar-row-selected); color: var(--sidebar-fg); }
.tc-nav-item[aria-current="page"] > .tc-icon { color: var(--sidebar-fg); }
.tc-nav-item > .tc-chip, .tc-nav-item > .tc-badge, .tc-nav-item > .tc-nav-count { margin-left: auto; }
.tc-nav-count { font: 400 0.75rem/1 var(--font-mono); color: var(--fg-muted); }
.tc-sidebar-foot { margin-top: auto; display: flex; flex-direction: column; gap: 0.25rem; padding: 0.25rem 0; }
.tc-server { display: flex; flex-direction: column; gap: 2px; padding: 0.375rem 0.625rem; border-radius: var(--radius-lg); border: 1px solid color-mix(in srgb, var(--border) 80%, transparent); background: color-mix(in srgb, var(--surface) 50%, transparent); font-size: 0.75rem; line-height: 1rem; color: var(--sidebar-fg-muted); }
[data-theme="dark"] .tc-server { background: transparent; border-color: var(--sidebar-border); }
.tc-server-row { display: flex; align-items: center; gap: 0.375rem; min-width: 0; }
.tc-server-row strong { font-weight: 500; color: var(--fg); }

.tc-main { display: flex; flex-direction: column; min-width: 0; }
.tc-topbar { display: flex; align-items: center; gap: var(--space-3); height: var(--topbar); padding: 0 var(--space-6); position: sticky; top: 0; z-index: var(--z-sticky);
  background: color-mix(in srgb, var(--bg) 80%, transparent); -webkit-backdrop-filter: blur(12px) saturate(1.14); backdrop-filter: blur(12px) saturate(1.14); }
.tc-crumbs { display: flex; align-items: center; gap: 0.75rem; font-size: 0.875rem; min-width: 0; margin: 0; padding: 0; list-style: none; }
.tc-crumbs > li { color: var(--fg-muted); }
.tc-crumbs > li[aria-current="page"] { color: var(--fg); font-weight: 500; }
.tc-crumbs > li + li::before { content: "/"; margin-right: 0.75rem; color: var(--fg-subtle); font-weight: 400; }
.tc-topbar-title { font-size: 0.875rem; line-height: 1.25rem; font-weight: 500; margin: 0; }
.tc-page { width: 100%; max-width: var(--content); margin: 0 auto; padding: var(--space-6) var(--space-6) var(--space-12); display: flex; flex-direction: column; gap: var(--space-8); }
.tc-page--wide { max-width: 64rem; }
.tc-page-lede { color: var(--fg-muted); margin: 0; font-size: 0.875rem; max-width: 64ch; }
.tc-grid-2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: var(--space-6); align-items: start; }

.tc-tabbar { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--border);
  background: color-mix(in srgb, var(--bg) 80%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
.tc-tab { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: var(--touch); padding: 0.25rem 0; border: 0; background: transparent; color: var(--fg-muted); font: inherit; font-size: 0.6875rem; font-weight: 500; cursor: pointer; position: relative; text-decoration: none !important; }
.tc-tab .tc-icon { width: 1.25rem; height: 1.25rem; }
.tc-tab-ico { display: grid; place-items: center; width: 3rem; height: 1.75rem; border-radius: var(--radius-md); position: relative; }
.tc-tab[aria-current="page"] { color: var(--fg); }
.tc-tab[aria-current="page"] .tc-tab-ico { background: var(--hover); }
[data-theme="dark"] .tc-tab[aria-current="page"] .tc-tab-ico { background: color-mix(in srgb, var(--border-strong) 64%, transparent); }
.tc-tab-badge { position: absolute; top: 0.1875rem; right: 0.6875rem; width: 0.375rem; height: 0.375rem; border-radius: 50%; background: var(--warn); }

/* touch density: upstream's mobile sizes (36px buttons, 34px inputs, 16px text in inputs) */
.tc-root[data-density="touch"] .tc-btn { --_h: 2.25rem; font-size: 1rem; padding: 0 0.8125rem; }
.tc-root[data-density="touch"] .tc-btn--sm { --_h: 2rem; font-size: 0.875rem; }
.tc-root[data-density="touch"] .tc-btn .tc-icon { width: 1.125rem; height: 1.125rem; }
.tc-root[data-density="touch"] .tc-btn--icon { padding: 0; }
.tc-root[data-density="touch"] .tc-input, .tc-root[data-density="touch"] .tc-select { height: 2.125rem; font-size: 1rem; }
.tc-root[data-density="touch"] .tc-menu-item { min-height: 2.5rem; font-size: 1rem; }
.tc-root[data-density="touch"] .tc-kbd { display: none; }

/* ------------------------------------------------------------- motion -- */
@keyframes tc-spin { to { transform: rotate(360deg); } }
/* upstream status-ping: burst, then hold invisible; stepped */
@keyframes tc-ping { 0% { opacity: 0.9; scale: 0.75; animation-timing-function: steps(8); } 40%, 100% { opacity: 0; scale: 2; } }
@keyframes tc-pulse { 0%, 40% { opacity: 1; animation-timing-function: steps(6); } 50%, 90% { opacity: 0.5; animation-timing-function: steps(6); } 100% { opacity: 1; } }
@keyframes tc-breathe { 0%, 42% { opacity: 1; animation-timing-function: steps(4); } 50%, 92% { opacity: 0.55; animation-timing-function: steps(4); } 100% { opacity: 1; } }
@keyframes tc-indet { 0% { transform: translateX(-100%); } 100% { transform: translateX(320%); } }
@keyframes tc-rise { from { opacity: 0; transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) {
  /* A nonzero duration would animate default transition-property: all. */
  .tc-root *, .tc-root *::before, .tc-root *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0s !important; }
  .tc-dot--live::after { display: none; }
}

  if(kind==='dependencies') {
    title=id==='uninstall'?'Tailscale is still in use':'This connection has dependents'; description='Review what would lose connectivity';
    body=`${notice('Resolve these routes first','Tailscale cannot be removed while these routes depend on it. Manage the routes or choose a replacement connection.','warn')}<div class="tc-group">${hasInstall()&&state.mode==='tailscale'?row('terminal','SSH access','Terminal and editor connections use Work tailnet'):''}${row('globe','Workspace preview','Private preview route uses Work tailnet')}</div><p class="helper">Your current access path cannot be confirmed from these server checks. Establish another way in before disabling a shared connection.</p>`;
    footer=`${close}${btn('Manage routes','manage-routes','tc-btn--primary')}`;
  }
  if(kind==='disable-ssh') {
    title='Disable SSH?'; description='This stops SSH and its owned routes';
    body=`${notice('New SSH connections will be unavailable','Active SSH sessions may be interrupted. Browser access remains available in this example.','warn')}<p class="helper">Retain authorized keys, server identity, configuration, and the installed version. Tailscale is shared and will stay running.</p>`;
    footer=`${btn('Cancel','close')}${btn('Disable SSH','confirm-disable','tc-btn--danger-solid')}`;
  }
  if(kind==='uninstall-ssh') {
    title='Uninstall SSH?'; description='Remove its payload after stopping the service';
    body=`<p class="helper">Remove SSH and its owned routes. Keep its public-key authorizations, configuration, and server identity for a later reinstall. Shared Tailscale remains installed.</p>${notice('Access will be interrupted','Review another access path before removing this service. Identity deletion is a separate action.','warn')}`;
    footer=`${btn('Cancel','close')}${btn('Uninstall SSH','confirm-uninstall','tc-btn--danger-solid')}`;
  }
  if(kind==='connection') {
    title='Work tailnet'; description='Tailscale · Managed here';
    body=`${kv([['Connection',routeStatus()],['Hostname',esc(state.host)],['Supported routes','SSH, HTTP, TCP'],['Used by','SSH, Workspace preview'],['Checked',state.scenario==='stale'?'8 minutes ago · stale':'30 seconds ago']])}<p class="helper">Provider and local checks do not prove that a particular device can reach this route. Account logout and local disable are separate operations.</p><div class="action-list">${btn('View service','inspect-tail','tc-btn--ghost')}${btn('Disable connection','disable-tail','tc-btn--ghost')}${btn('Disconnect account','disconnect','tc-btn--ghost tc-btn--danger')}</div>`;
    footer=close;
  }
  if(kind==='disconnect') {
    title='Disconnect Work tailnet?'; description='Provider access must be revoked separately from stopping locally';
    body=`${notice('Two routes depend on this account','Move or disable SSH and Workspace preview routes before disconnecting.','warn')}<p class="helper">If provider logout cannot be confirmed, cleanup stays pending. The console must not report revocation merely because the local process stopped.</p>`;

  if(kind==='error'||kind==='tail-diagnostics') {

    const failed=kind==='error'&&state.scenario==='failed';
    const log=state.scenario==='stale'?'controller observation unavailable\nlast known state: stale':kind==='error'?(failed?'sshd: bind to port 2222: Address already in use\nretry budget exhausted; service stopped\nretained: host identity and authorized keys':state.disabled?'desired state: disabled\nidentity and configuration retained':'local SSH handshake: passed\nclient route evidence: not verified'):(state.scenario==='expired'?'provider: sign-in expired\nroute: unavailable\nSSH service: still running':'provider: signed in\nroute: declared local endpoint\nclient reachability: not verified');
    body=`${failed?notice('Port 2222 is already in use','SSH stopped after its retry budget was exhausted. Review the conflicting listener before retrying.','danger'):notice('Service checks','These diagnostics are simulated. They show the distinction between local readiness and client evidence.')}<pre class="log-view">${log}</pre><p class="operation-id">${state.operationId} · ${failed?'SSH_LISTENER_CONFLICT':kind==='error'?'SSH_CHECK':'CONNECTION_CHECK'}</p>`;
    footer=`${close}${btn(state.scenario==='failed'?'Simulate conflict resolved':'Run checks',state.scenario==='failed'?'resolve-failure':'recheck','tc-btn--primary')}`;
  }
  if(kind==='update') {
    title='Update SSH server'; description='Review the service change';
    body=`${kv([['Current','9.9p2'],['Candidate','10.0p2 · Example version'],['Source','Curated, verified artifact'],['Affected','SSH service and owned routes'],['Core runtime','No version or channel change'],['Recovery','Retain 9.9p2 and current configuration']])}${notice('SSH access will be interrupted','Sessions may disconnect during replacement. If readiness fails, restore the previous version.','warn')}<p class="helper">The simulation deliberately exercises a readiness failure and rollback. It does not claim a real update was tested.</p>`;
    footer=`${btn('Cancel','close')}${btn('Simulate update and rollback','simulate-update','tc-btn--primary')}`;
  }
  if(kind==='rollback') {
    title='Update rolled back'; description='Previous version is running';
    body=`${notice('Candidate did not pass readiness','OpenSSH 10.0p2 failed its local handshake check. Restored OpenSSH 9.9p2 with the previous configuration.','warn')}<ol class="timeline"><li>${icon('check')}<span>Candidate verified and installed</span></li><li>${icon('circle-alert')}<span>Readiness failed<small>No successful local SSH handshake</small></span></li><li>${icon('check')}<span>Previous version restored<small>OpenSSH 9.9p2 running · Route check passed</small></span></li></ol><p class="operation-id">op-demo-update-7b32</p><p class="helper">Reconnect from your device. A server-local check does not verify your current client route.</p>`;
    footer=`${close}${btn('View service','inspect-ssh','tc-btn--primary')}`;
  }
  if(kind==='storage') {
    title='Add persistent service storage'; description='One deployment change before installation';
    body=`<p class="helper">Optional service binaries and identities need a protected persistent volume. A container restart alone does not attach one.</p><div class="command"><pre id="deployment-patch">services:\n  t3code:\n    volumes:\n      - t3code-services:/var/lib/t3code/services\nvolumes:\n  t3code-services:</pre>${btn(`${icon('copy')}<span class="tc-sr">Copy illustrative volume fragment</span>`,'copy-patch','tc-btn--ghost tc-btn--icon')}</div>${notice('Illustrative fragment only','Merge this with the actual deployment. Keep existing mounts, environment, image pin, ports, and runtime selection. A recreate is required.')}<p class="helper">The production console must inspect your deployment before generating an exact patch. This prototype cannot inspect or modify it.</p>`;
    footer=`${close}${btn('Simulate storage attached','storage-fixed','tc-btn--primary')}`;
  }
  if(kind==='add-key') {
    title='Add an SSH key'; description='Authorize another device'; body=keyFields('','','',false);
    footer=`${btn('Cancel','close')}${btn('Add key','save-key','tc-btn--primary')}`;
  }
  if(kind==='key') {
    const key=state.keys.find(k=>k.id===id); title=key?.label||'SSH key'; description='Incoming SSH authorization';
    body=`${kv([['Type',esc(key?.type||'ED25519')],['Fingerprint',`<span class="fingerprint">${esc(key?.fp||'')}</span>`],['Last sign-in',state.deviceObserved?'Observed in simulation':'Not observed']])}<p class="helper">Removing a public key blocks future authentication. Existing sessions may remain connected.</p>`;
    footer=`${close}${btn('Remove key',`remove-key-${id}`,'tc-btn--danger')}`;
  }
  if(kind==='remove-key') {
    title='Remove SSH key?'; description=state.keys.find(k=>k.id===id)?.label||'Selected device';
    body=`${notice(state.keys.length===1?'This is the last authorized key':'Future sign-ins will be blocked',state.keys.length===1?'Make sure you can still use browser or host access before removing it. Existing sessions may remain.':'Existing sessions may remain connected. Other keys are unaffected.','warn')}`;
    footer=`${btn('Cancel','close')}${btn('Remove key',`confirm-remove-${id}`,'tc-btn--danger-solid')}`;
  }
  if(kind==='verify') {
    title='Connection evidence'; description='Each check has a different scope';
    body=`${kv([['Local service',ready()?'SSH handshake passed':'See current service status'],['Connection',routeStatus()],['Device sign-in',state.deviceObserved?'Observed in simulation':'Not observed'],['Exact client route','Not verified']])}<p class="helper">An authenticated route challenge is needed to verify the exact path from your device. A login alone only establishes that a sign-in occurred.</p><p class="helper">Use the action below to explore the observed-login copy. It does not make a real connection.</p>`;
    footer=`${close}${btn('Simulate SSH sign-in','simulate-login','tc-btn--primary')}`;
  }
  if(kind==='add-connection') {
    title='Add a connection'; description='Choose who manages the network path';
    body=`<div class="action-list">${btn(`${icon('globe')} Tailscale`,'tailscale-options','tc-btn--ghost')}${btn(`${icon('cloud')} Cloudflare`,'cloudflare','tc-btn--ghost')}${btn(`${icon('server')} Existing host or sidecar`,'external','tc-btn--ghost')}</div><p class="helper">Connections are shared resources. Reuse an existing one before creating another identity.</p>`;
    footer=close;
  }
  if(kind==='cloudflare'||kind==='tailscale-options') {
    const cloud=kind==='cloudflare'; title=cloud?'Cloudflare connection':'Tailscale connection'; description='Configuration contract';
    body=`${notice(cloud?'SSH requires a named route':'Reuse your existing connection',cloud?'Configure a hostname, tunnel and Access policy. Client-side cloudflared may be required. An HTTP quick tunnel is not a raw SSH endpoint.':'Work tailnet already serves this container. Reuse it to avoid creating another node.')}<p class="helper">${cloud?'The full provider configuration is specified in the UI contract. This reference implements the shared service shell and SSH setup, rather than simulating an entire Cloudflare account console.':'The installation review checks kernel or proven userspace mode, persistent identity, and required deployment permissions.'}</p>`;
    footer=`${close}${btn(cloud?'Explore SSH setup':'Use Work tailnet','connector-setup','tc-btn--primary')}`;
  }
  if(kind==='cloudflare-finish') {
    title='Cloudflare SSH route';description=state.connectorPending?'Finish account and route setup':'Managed connection · Example configuration';
    body=`${kv([['Hostname',esc(state.host)],['Route','SSH to local endpoint :2222'],['Client helper','cloudflared on your device'],['Authorization','Cloudflare Access and your SSH key']])}<p class="helper">Production requires account authorization, a named tunnel, a hostname, and a checked Access policy. The provider-specific steps must reconcile independently.</p>${notice('Simulation only','Completing this example stands in for those configuration steps. It opens no provider page and makes no network changes.')}`;
    footer=`${close}${state.connectorPending?btn('Simulate route configured','complete-cloudflare','tc-btn--primary'):''}`;
  }
  if(kind==='external') {
    title='Office network'; description='Managed on host';
    body=`${kv([['Lifecycle owner','Host or Compose'],['Local service','SSH listener on container interface'],['Client endpoint','Operator-provided host and port'],['External status','Unknown until checked']])}<p class="helper">A host port mapping cannot reach a daemon bound only to container loopback. Configure the listener and mapping together. Setup can export guidance and test declared endpoints, but cannot restart your host connector.</p>`;
    footer=close;
  }
  if(['public-url','t3-connect','device'].includes(kind)) {
    title=kind==='public-url'?'Public URL':kind==='t3-connect'?'T3 Connect':'Work laptop'; description='Existing Access behavior';
    body=notice('Kept in its existing flow',kind==='t3-connect'?'T3 owns its application connection. It is not advertised as an SSH transport.':kind==='public-url'?'The configured application URL remains unchanged by optional service setup.':'Pairing and device revocation remain independent of SSH public-key authorization.');
    footer=close;
  }
  sheet.innerHTML=`<div class="sheet-layout"><header class="sheet-header"><div><h2 id="sheet-title" tabindex="-1">${esc(title)}</h2><p id="sheet-description">${esc(description)}</p></div>${btn(`${icon('x')}<span class="tc-sr">Close ${esc(title)}</span>`,'close','tc-btn--ghost tc-btn--icon')}</header><div class="sheet-body">${body}</div><footer class="sheet-footer">${footer}</footer></div>`;
}
function keyFields(label,key,error,onboarding) {
  return `<div class="field"><label class="tc-label" for="key-label">Key label <span class="tc-label-opt">optional</span></label><input class="tc-input autofocus" id="key-label" value="${esc(label)}" placeholder="e.g. Work laptop" maxlength="80"></div><div class="field"><label class="tc-label" for="public-key">Public key</label><textarea class="tc-input tc-input--mono" id="public-key" placeholder="ssh-ed25519 AAAA…" aria-describedby="key-help${error?' key-error':''}" ${error?'aria-invalid="true"':''}>${esc(key)}</textarea><p id="key-help" class="helper">Paste a public key from your device, usually a file ending in .pub. Your private key stays on your device.</p>${error?`<p id="key-error" class="field-error" role="alert">${esc(error)}</p>`:''}</div>${btn('Use sample public key','sample-key','tc-btn--ghost')}<p class="helper">${onboarding?'Authorize at least one device before enabling SSH. ':''}This prototype checks basic format only. Production uses OpenSSH validation and computes the actual fingerprint.</p>`;
}
function readWizard() {
  const w=state.wizard;
  if($('input[name="connection"]:checked',sheet)) w.mode=$('input[name="connection"]:checked',sheet).value;
  if($('#external-host')) w.host=$('#external-host').value;
  if($('#key-label')) w.label=$('#key-label').value;
  if($('#public-key')) w.key=$('#public-key').value;
}
function keyError(value) {
  if(/PRIVATE KEY/.test(value)) return 'This is a private key. Paste only its public key.';
  if(!/^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp(?:256|384|521))\s+[A-Za-z0-9+/]{24,}={0,2}(?:\s+[^\r\n]*)?$/.test(value.trim())) return 'Paste a complete supported public key.';
  return '';
}
async function copyText(value,source) {
  let copied=false;
  try { if(navigator.clipboard?.writeText) {await navigator.clipboard.writeText(value);copied=true;} } catch {}
  if(!copied) {
    const area=document.createElement('textarea'); area.value=value; area.style.cssText='position:fixed;left:-9999px;top:0'; (sheet.open?sheet:document.body).append(area); area.select();
    try { copied=document.execCommand('copy'); } catch {} area.remove();
  }
  if(copied) toast('Copied');
  else {
    const range=document.createRange();range.selectNodeContents(source);const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);
    announce(`Text selected. Press ${/Mac|iPhone|iPad/.test(navigator.platform)?'Command C':'Ctrl C'} to copy.`);
    toast(`Text selected. Press ${/Mac|iPhone|iPad/.test(navigator.platform)?'Command C':'Ctrl C'} to copy.`);
  }
}
async function act(action) {
  if(action==='add-service'||action.startsWith('custom-'))return customAct(action);
  if(action==='close') return closeSheet();
  if(action==='nav-access') return navigate('access');
  if(action==='nav-services') return navigate('services');
  if(action.startsWith('tab-')) {state.tab=action.slice(4);try{history.pushState(null,'',`#access/${state.tab}`);}catch{}renderApp(`access-${state.tab}`);return;}
  if(action.startsWith('client-')) {state.client=action.slice(7);renderApp(`client-${state.client}`);return;}
  if(action.startsWith('view-')) {state.view=action.slice(5);renderApp(`view-${state.view}`);return;}
  if(action==='open-ssh') return navigate('access','ssh');
  if(action==='setup') return openSheet(state.scenario==='storage'?'storage':'wizard');
  if(action==='wizard-back') {readWizard();state.wizard.step--;state.wizard.error='';renderSheet();$('#sheet-title').focus();return;}
  if(action==='wizard-next') {
    readWizard();const w=state.wizard;
    if(w.step===1&&w.mode==='existing'&&!/^[a-zA-Z0-9][a-zA-Z0-9.:-]*$/.test(w.host.trim())) {w.error='Enter a client-visible hostname.';renderSheet();$('#external-host').focus();return;}
    if(w.step===1)w.error='';
    if(w.step===2) {w.error=keyError(w.key);if(w.error){if(/PRIVATE KEY/.test(w.key))w.key='';renderSheet();$('#public-key').focus();return;}}
    if(w.step<3) {w.step++;renderSheet();$('#sheet-title').focus();return;}
    state.mode=w.mode;state.host=w.mode==='tailscale'?'t3-workstation.example.ts.net':w.mode==='cloudflare'?'ssh.example.com':w.host;
    state.keys=[{id:1,label:w.label||'My device',type:'ED25519',fp:w.key===SAMPLE_KEY?KEY_FP:'Pending server validation (prototype)',last:'Not observed'}];
    state.scenario='installing';state.installStep=0;$('#scenario').value='installing';renderApp();return openSheet('progress');
  }
  if(action==='sample-key') {$('#public-key').value=SAMPLE_KEY;if(!$('#key-label').value)$('#key-label').value='Work laptop';$('#public-key').removeAttribute('aria-invalid');$('#public-key').focus();return;}
  if(action==='advance') {if(state.installStep<4) {state.installStep++;renderSheet();$('#sheet-title').focus();announce('Next simulated installation step.');} else {state.scenario='ready';state.connectorPending=state.mode==='cloudflare';state.wizard.step=1;$('#scenario').value='ready';renderApp();closeSheet();toast(state.connectorPending?'SSH installed in simulation. Finish connection setup.':'Simulation complete. Ready to connect.');}return;}
  if(action==='complete-cloudflare') {state.connectorPending=false;renderApp();closeSheet();toast('Simulation: route configured. Ready to connect.');return;}
  if(action==='recheck') {state.checked=true;if(state.scenario==='stale'){state.scenario='ready';$('#scenario').value='ready';}if(sheet.open)closeSheet();renderApp();toast(state.scenario==='failed'?'SSH check failed. Review the listener conflict.':state.scenario==='expired'?'SSH is running. Connection sign-in is still required.':'Readiness checked. Device reachability has not been verified.');return;}
  if(action==='resolve-failure') {state.scenario='ready';$('#scenario').value='ready';renderApp();closeSheet();toast('Simulation: SSH started after the listener conflict was resolved.');return;}
  if(action==='complete-signin') {state.scenario='ready';$('#scenario').value='ready';renderApp();closeSheet();toast('Simulation: connection sign-in restored.');return;}
  if(action==='simulate-update') {state.scenario='rollback';$('#scenario').value='rollback';renderApp();return openSheet('rollback');}
  if(action==='storage-fixed') {state.scenario='fresh';$('#scenario').value='fresh';renderApp();return openSheet('wizard');}
  if(action==='disable-tail'||action==='uninstall-tail') return openSheet('dependencies',action==='uninstall-tail'?'uninstall':'disable');
  if(action==='manage-routes') {closeSheet();return navigate('access','connections');}
  if(action==='confirm-disable') {state.disabled=true;renderApp();closeSheet();toast('SSH disabled. Keys and identity retained.');return;}
  if(action==='enable-ssh'||action==='enable-tail') {state[action==='enable-ssh'?'disabled':'tailDisabled']=false;if(sheet.open)closeSheet();renderApp();toast('Enabled in simulation.');return;}
  if(action==='confirm-uninstall') {setScenario('fresh',false);closeSheet();toast('SSH payload removed in simulation. Identity retention is specified in the design.');return;}
  if(action==='simulate-login') {state.deviceObserved=true;renderApp();renderSheet();$('#sheet-title').focus();announce('SSH sign-in observed. Exact route remains unverified.');return;}
  if(action==='copy-command') return copyText($('#client-command').textContent,$('#client-command'));
  if(action==='copy-fingerprint') return copyText(HOST_FP,$('.fingerprint'));
  if(action==='copy-patch') return copyText($('#deployment-patch').textContent,$('#deployment-patch'));
  if(action==='save-key') {
    const value=$('#public-key').value,label=$('#key-label').value||'My device',error=keyError(value);
    if(error){const privateKey=/PRIVATE KEY/.test(value);$('.sheet-body',sheet).innerHTML=keyFields(label,privateKey?'':value,error,false);$('#public-key').focus();return;}
    if(state.keys.some(k=>k.fp===KEY_FP)&&value===SAMPLE_KEY){announce('This sample key is already authorized.');$('.sheet-body',sheet).innerHTML=keyFields(label,value,'This public key is already authorized.',false);$('#public-key').focus();return;}
    state.keys.push({id:Date.now(),label,type:'ED25519',fp:value===SAMPLE_KEY?KEY_FP:'Pending server validation (prototype)',last:'Not observed'});renderApp();closeSheet();toast('Public key added in simulation.');return;
  }
  if(action.startsWith('confirm-remove-')) {state.keys=state.keys.filter(k=>k.id!==Number(action.slice(15)));renderApp();closeSheet();toast('Key removed in simulation. Existing sessions may remain.');return;}
  if(action.startsWith('remove-key-')) return openSheet('remove-key',Number(action.slice(11)));
  if(action.startsWith('key-')) return openSheet('key',Number(action.slice(4)));
  if(action==='clear-search') {state.query='';$('#service-search').value='';$('#service-results').innerHTML=serviceRows();$('#service-search').focus();return;}
  if(action==='browse') {state.view='available';state.query='';renderApp('view-available');return;}
  if(action==='connector-setup') {state.wizard.mode=state.modal.kind==='cloudflare'?'cloudflare':'tailscale';return openSheet('wizard');}
  const map={'inspect-ssh':'ssh','inspect-tail':'tail','progress':'progress','signin':'signin','error':'error','rollback':'rollback','storage':'storage','add-key':'add-key','disable-ssh':'disable-ssh','uninstall-ssh':'uninstall-ssh','connection':'connection','update':'update','verify':'verify','add-connection':'add-connection','cloudflare':'cloudflare','cloudflare-finish':'cloudflare-finish','tailscale-options':'tailscale-options','external':'external','public-url':'public-url','t3-connect':'t3-connect','device':'device','disconnect':'disconnect','tail-diagnostics':'tail-diagnostics'};
  if(map[action])return openSheet(map[action]);
  throw new Error(`Unimplemented prototype action: ${action}`);
}
document.addEventListener('click',e=>{const button=e.target.closest('[data-action]');if(button)act(button.dataset.action).catch(error=>{console.error(error);announce('Prototype interaction failed.');});});
document.addEventListener('input',e=>{if(e.target.id==='service-search'){state.query=e.target.value;$('#service-results').innerHTML=serviceRows();}customInput(e.target);});
document.addEventListener('change',e=>{
  customChange(e.target);
  if(e.target.id==='scenario')setScenario(e.target.value);
  if(e.target.id==='appearance'){const val=e.target.value;document.documentElement.dataset.theme=val==='host'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):val;$('#prototype').dataset.palette=val==='host'?'host':'standalone';}
  if(e.target.id==='page-select')navigate(e.target.value);
  if(e.target.name==='connection'){$('#external-field').hidden=e.target.value!=='existing';}
});
document.addEventListener('keydown',e=>{
  const tab=e.target.closest('[role="tab"]');if(!tab||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;
  const tabs=[...tab.parentElement.querySelectorAll('[role="tab"]')],i=tabs.indexOf(tab);
  const next=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;
  e.preventDefault();tabs[next].click();
});
sheet.addEventListener('cancel',e=>{e.preventDefault();closeSheet();});
window.addEventListener('resize',sizeSheet);
window.visualViewport?.addEventListener('resize',sizeSheet);
window.addEventListener('popstate',()=>{state.page=location.hash.startsWith('#services')?'services':'access';const tab=location.hash.split('/')[1];if(['devices','connections','ssh'].includes(tab))state.tab=tab;renderApp();});
document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
setScenario(window.__PROTOTYPE_SCENARIO__||'ready',false);
if(location.hash.startsWith('#services')){state.page='services';renderApp();}
window.__prototype = {state,act,setScenario,renderApp,openSheet,closeSheet,keyError,command};
</script>
